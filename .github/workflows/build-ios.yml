name: Build unsigned iPhone app

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  iphone:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app without signing
        run: |
          xcodebuild -project ios/iPhoneUSBObs.xcodeproj \
            -scheme iPhoneUSBObs -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/iphone-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/iPhoneUSBObs.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/iPhoneUSBObs-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneUSBObs-unsigned-ipa
          path: iPhoneUSBObs-unsigned.ipa
